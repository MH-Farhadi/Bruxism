# Continuous integration.
#
# Every job here runs on SYNTHETIC fixtures only. Nothing in this workflow reads, needs or
# has access to the private participant data root, so it is safe to enable on a public
# repository.
name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / types / tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only torch keeps the runner small and fast)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,video]"

      - name: Format check
        run: python -m ruff format --check src scripts tests

      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Type check
        run: python -m mypy

      - name: Unit tests
        run: python -m pytest -m "not slow" --cov=bruxism --cov-report=term-missing

      - name: Integration tests (synthetic participants, end to end)
        run: python -m pytest tests/integration -q

      - name: Assert no raw data or private asset was committed
        run: |
          set -e
          # Only the synthetic fixtures may produce CSVs, and they are generated at runtime.
          if git ls-files | grep -E '\.(csv|avi|npy|parquet)$' ; then
            echo "::error::raw or derived data files are tracked in git"; exit 1
          fi
          if git ls-files | grep -Ei 'survey|receipt|reconciliation|\.heic$' ; then
            echo "::error::a private asset is tracked in git"; exit 1
          fi
