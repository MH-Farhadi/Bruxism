# Secondary endpoints: binary tooth-contact, ternary, and the provenance-only legacy task.
#
#   bruxism-ablations --config configs/experiments/secondary_tasks.yaml
#
# Each is a purpose-trained model under the same outer protocol -- NOT a relabelling of the
# five-class confusion matrix. legacy_active_four_class is provenance only and omits rest.
name: secondary_tasks
description: Binary / ternary / legacy-four-class endpoints, each purpose-trained.
task_id: binary_tooth_contact
model_id: dual_branch_wavelet_cnn
modality: fusion
sweep_task_ids: [binary_tooth_contact, ternary, legacy_active_four_class]

data:
  data_root: ../Data
  sampling_rate_hz: 1200
  segmentation_policy: trigger_constrained
  window_seconds: 1.0
  stride_seconds: 0.5
  guard_seconds: 0.25
  startup_guard_seconds: 0.5
  shutdown_guard_seconds: 0.0
  allow_trigger_off_as_rest: false
  emg_channels: null
  cache_dir: outputs/cache

filters:
  # SUPERSEDES the 2026-07 chain, which notched 60 Hz and band-passed 20-450 Hz.
  #
  # The acquisition hardware had ALREADY removed 60 Hz (`notch_filter: Index 9` in every
  # metadata sidecar), so that notch removed the one mains frequency that was not there
  # while 180/300/420 Hz -- 37,000x to 846,000x above the local noise floor -- passed
  # straight through and made up 85-99 % of the in-band power of the "filtered" signal.
  # See cause.md and docs/open_questions.md Q9. `emg_mains` expands to one notch per mains
  # multiple inside the passband (60, 120, 180, 240, 300, 360, 420 Hz) plus the bandpass;
  # resolved_config.yaml in every run bundle records the expansion.
  #
  # Results produced with this chain are NOT comparable to any result produced before it.
  zero_phase: true          # filtfilt: ACAUSAL / OFFLINE. Not a real-time chain.
  emg_mains:
    mains_hz: 60.0
    notch_harmonics: true   # false reproduces the superseded chain, for regression checks
    quality: 30.0
    band_hz: [20.0, 450.0]
  mic_stages:
    - {kind: highpass, freq_hz: 20.0, order: 2,
       rationale: "Remove the large DC offset; no further shaping, the transducer response is undocumented."}

normalization:
  scope: per_channel
  method: zscore

augmentation:
  enabled: true
  probability: 0.4
  minority_only: true
  minority_threshold: 0.7
  amplitude_scale_range: [0.9, 1.1]
  noise_std_fraction: 0.02
  max_shift_samples: 50

selection:
  objective: macro_f1        # prespecified; imbalance makes accuracy misleading
  epoch_budget_rule: median
  min_epochs: 5
  max_epochs: 60
  patience: 15

training:
  batch_size: 64
  learning_rate: 0.001
  optimizer: adamw
  loss: focal
  focal_gamma: 1.5
  class_weight_scheme: balanced
  num_workers: 0
  device: auto
  deterministic: true
  seeds: [0, 1, 2]
  search_space: {}

output:
  runs_root: outputs/runs
  save_checkpoints: true

# --- microphone defect acknowledgements (audio.md, 2026-08-12) ------------------------
# The microphone channel of the 2025-08 collection is duplicated across participants,
# unaligned with the EMG, and at the quantisation floor in its analysis band; and the mic
# branch reads A5 (0-18.75 Hz), which its own 20 Hz high-pass has already removed. Both
# guards would refuse this run. It is declared rather than fixed because this configuration
# must keep reproducing the published bundle byte for byte. Neither key enters the
# configuration hash -- an acknowledgement records who authorised a run, not what it
# computes -- so this file still hashes to the value in the manuscript.
mic_defect_acknowledged_by: >-
  audio.md audit, 2026-08-12: reproduces a published run on the defective microphone
  channel. Any modality contrast from this run bounds what a duplicated, unaligned,
  envelope-band channel contributes under this architecture; it does not measure what a
  microphone contributes.
stopband_bands_acknowledged_by: >-
  audio.md audit, 2026-08-12: the published mic branch reads A5 behind a 20 Hz high-pass.
  Retained to reproduce the reported runs; not to be copied into a new configuration.
